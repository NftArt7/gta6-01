<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar City — Open-World Heist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud-top-left { position: absolute; top: 16px; left: 16px; }
  #hud-money { font-size: 30px; font-weight: 800; color: #7dff9b; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hud-health { margin-top: 6px; width: 210px; height: 18px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 9px; overflow: hidden; position: relative; }
  #hud-health-fill { height: 100%; width: 100%; background: #58b368; transition: width .2s; }
  #hud-health-text { position: absolute; inset: 0; text-align: center; font-size: 12px; font-weight: 700; line-height: 18px; text-shadow: 0 1px 2px #000; }
  #hud-objective { margin-top: 10px; max-width: 420px; background: rgba(0,0,0,.55); border-left: 4px solid #ffd23c; padding: 8px 12px; font-size: 14px; line-height: 1.4; border-radius: 0 6px 6px 0; }
  #hud-top-right { position: absolute; top: 16px; right: 16px; text-align: right; }
  #hud-stars { font-size: 26px; letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-stars .star { color: rgba(255,255,255,.25); }
  #hud-stars .star.on { color: #ffd23c; }
  #hud-minimap { margin-top: 8px; border: 2px solid rgba(255,255,255,.5); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #hud-clock { margin-top: 6px; font-size: 20px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  #hud-bottom-right { position: absolute; right: 20px; bottom: 18px; font-size: 34px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #hud-bottom-right small { font-size: 15px; font-weight: 600; }
  #hud-toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.3); padding: 10px 18px; border-radius: 8px; font-size: 16px; font-weight: 600; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #hud-toast.show { opacity: 1; }
  #hud-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #hud-screen .panel { pointer-events: auto; text-align: center; background: rgba(8,12,20,.82); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 36px 48px; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #hud-screen h1 { font-size: 52px; letter-spacing: 4px; font-weight: 900; background: linear-gradient(180deg, #ffe9a8, #ff9d5c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #hud-screen .tag { margin: 12px 0 18px; font-size: 16px; line-height: 1.5; color: #dfe6ee; }
  #hud-screen .controls { font-size: 14px; line-height: 1.9; color: #aeb9c6; margin-bottom: 20px; }
  #hud-screen .controls b { color: #ffd23c; }
  #hud-screen button { display: block; width: 280px; margin: 10px auto 0; padding: 13px; font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #10131a; background: linear-gradient(180deg, #ffd23c, #f5a623); border: none; border-radius: 10px; cursor: pointer; }
  #hud-screen button:hover { filter: brightness(1.1); }
  #hud-screen .fine { margin-top: 18px; font-size: 12px; color: #8b98a8; line-height: 1.5; }
  #hud-screen .stats { font-size: 19px; line-height: 1.8; margin: 8px 0 14px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
