<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solmar City — Open-World Heist</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1218; font-family: Arial, Helvetica, sans-serif; }
      #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .panel { background: rgba(10, 16, 22, 0.78); border: 1px solid rgba(240, 192, 32, 0.35); border-radius: 10px; color: #f0ead8; }
      #hud-top { position: fixed; top: 14px; left: 14px; padding: 10px 14px; display: flex; gap: 18px; align-items: center; z-index: 5; }
      #cash { font-size: 22px; font-weight: bold; color: #f0c020; letter-spacing: 0.5px; }
      #stars { font-size: 20px; letter-spacing: 2px; }
      #stars .star { color: rgba(255, 255, 255, 0.25); }
      #stars .star.on { color: #ffd94a; text-shadow: 0 0 8px rgba(255, 217, 74, 0.9); }
      #timer { font-size: 22px; font-weight: bold; color: #ffffff; }
      #timer.urgent { color: #ff5040; }
      #minimap { position: fixed; top: 14px; right: 14px; width: 150px; height: 150px; border: 1px solid rgba(240, 192, 32, 0.5); border-radius: 10px; z-index: 5; }
      #objective { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); padding: 10px 18px; font-size: 16px; text-align: center; z-index: 5; max-width: 70vw; }
      #obj-dist { color: #f0c020; font-weight: bold; margin-left: 8px; }
      #speed { position: fixed; left: 14px; bottom: 14px; padding: 10px 16px; z-index: 5; text-align: center; min-width: 110px; }
      #speed b { font-size: 30px; color: #ffffff; display: block; line-height: 1; }
      #speed span { font-size: 11px; letter-spacing: 2px; color: #f0c020; }
      #hint { position: fixed; right: 14px; bottom: 14px; padding: 8px 12px; font-size: 12px; color: rgba(240, 234, 216, 0.85); z-index: 5; }
      #toast { position: fixed; top: 84px; left: 50%; transform: translateX(-50%); padding: 10px 20px; font-size: 15px; background: rgba(10, 16, 22, 0.85); border: 1px solid rgba(240, 192, 32, 0.5); border-radius: 8px; color: #ffe9a8; opacity: 0; transition: opacity 0.3s; z-index: 6; pointer-events: none; max-width: 80vw; text-align: center; }
      #toast.show { opacity: 1; }
      #arrow { position: fixed; left: 50%; top: 46%; font-size: 34px; color: #f0c020; text-shadow: 0 0 10px rgba(0, 0, 0, 0.8); z-index: 4; pointer-events: none; opacity: 0; }
      #overlay { position: fixed; inset: 0; background: rgba(6, 10, 14, 0.55); display: none; align-items: center; justify-content: center; z-index: 10; }
      #overlay.show { display: flex; }
      #overlay-card { max-width: 620px; width: 88vw; padding: 34px 38px; text-align: center; background: rgba(10, 16, 22, 0.92); border: 1px solid rgba(240, 192, 32, 0.55); border-radius: 14px; color: #f0ead8; }
      #overlay-title { font-size: 44px; letter-spacing: 6px; color: #f0c020; margin-bottom: 12px; }
      #overlay-text { font-size: 15px; line-height: 1.65; }
      #overlay-text ul { text-align: left; margin: 14px auto 4px; max-width: 420px; }
      #overlay-text li { margin: 5px 0; }
      #overlay-text .controls { margin-top: 16px; font-size: 13px; color: #c8c0a8; }
      #overlay-btn { margin-top: 22px; padding: 13px 30px; font-size: 16px; font-weight: bold; letter-spacing: 1px; color: #14100a; background: #f0c020; border: none; border-radius: 8px; cursor: pointer; }
      #overlay-btn:hover { background: #ffd94a; }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud-top" class="panel">
      <span id="cash">$0</span>
      <span id="stars"></span>
      <span id="timer"></span>
    </div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="objective" class="panel"><span id="objective-text"></span><span id="obj-dist"></span></div>
    <div id="speed" class="panel"><b id="speed-value">0</b><span id="speed-label">ON FOOT</span></div>
    <div id="hint" class="panel">WASD move / drive · E enter car · Space handbrake · P pause · M mute</div>
    <div id="toast"></div>
    <div id="arrow">➤</div>
    <div id="overlay">
      <div id="overlay-card">
        <div id="overlay-title">SOLMAR CITY</div>
        <div id="overlay-text"></div>
        <button id="overlay-btn">START</button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
